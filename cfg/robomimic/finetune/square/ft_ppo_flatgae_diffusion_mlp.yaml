defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_ablation_flatgae_diffusion_agent.TrainAblationFlatGAEDiffusionAgent

name: ${env_name}_ft_diffusion_mlp_flatgae_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/robomimic-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/robomimic-pretrain/square/square_pre_diffusion_mlp_ta4_td20/2024-07-10_01-46-16/checkpoint/state_8000.pt
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}.json
normalization_path: ${oc.env:DPPO_DATA_DIR}/robomimic/${env_name}/normalization.npz

seed: 123                           # match DPPO base seed for direct comparison
device: cuda:0
env_name: square
obs_dim: 23
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 10
cond_steps: 1
horizon_steps: 4
act_steps: 4

env:
  n_envs: 50
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 400
  save_video: False
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                    'robot0_eef_quat',
                    'robot0_gripper_qpos',
                    'object']
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb: null

train:
  n_train_itr: 201
  resume_from_itr: 0                # fresh start (matched to DPPO base, no resume)
  n_critic_warmup_itr: 2            # back to default
  n_steps: 400
  gamma: 0.999
  actor_lr: 1e-4
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-4
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 10
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 10000
  update_epochs: 10
  vf_coef: 0.5
  target_kl: 1
  # Q ensemble. See n_heads and q_aggregation below for the actual values.
  logprob_batch_size: 1000
  q_minibatch_size: 2048              # bumped from 1024 for cleaner Q gradients
  target_ema_rate: 1.0              # no Polyak — let Q track fast on square
  critic_q_lr: 3e-4
  # V_inner, the value along the denoising chain.
  use_v_inner: True
  v_inner_alpha: 0.5                # moderate inner influence + longer warmup
  v_inner_lambda: 0.95
  v_inner_update_epochs: 10           # bumped from 5 to match V_phi update_epochs
  v_inner_lr: 1e-3
  # ---- flat-GAE latent MDP knobs ----
  flat_bar_gamma: 1.0          # within-chain discount (env gamma applied only at boundary)
  flat_bar_lambda: 0.95        # single GAE lambda of the flattened MDP

model:
  _target_: model.diffusion.diffusion_ppo_dia.PPODIADiffusion
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  q_aggregation: mean               # average the heads, as on every other task here
  network_path: ${base_policy_path}
  actor:                            # square's bigger actor (1024×3 + cond_mlp)
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims: [1024, 1024, 1024]
    cond_mlp_dims: [512, 64]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObs
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  critic_q:
    _target_: model.common.critic.CriticObsAct
    action_dim: ${action_dim}
    action_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [2048, 2048, 2048]
    activation_type: Tanh
    use_layernorm: True
    residual_style: False
    n_heads: 10                     # 10-head Q ensemble
    dropout: 0.0                    # plumbed; flip to ~0.1 to enable Q regularization
  critic_v_inner:
    _target_: model.common.critic.CriticObsInnerState
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    mlp_dims: [1024, 1024, 1024]
    time_dim: 32
    activation_type: Mish
    use_layernorm: True
    residual_style: True
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
