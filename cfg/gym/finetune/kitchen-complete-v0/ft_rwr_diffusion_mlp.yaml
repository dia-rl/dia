defaults: [_self_]
hydra:
  run: {dir: '${logdir}'}
_target_: agent.finetune.train_rwr_diffusion_agent.TrainRWRDiffusionAgent
name: ${env_name}_rwr_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/gym-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: pretrained/${env_name}/normfix_bc_state_3000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/gym/${env_name}/normalization.npz
seed: 42
device: cuda:0
env_name: kitchen-complete-v0
obs_dim: 60
action_dim: 9
denoising_steps: 20
cond_steps: 1
horizon_steps: 4
act_steps: 4
env:
  n_envs: 40
  name: ${env_name}
  max_episode_steps: 280
  reset_at_iteration: false
  save_video: false
  best_reward_threshold_for_success: 4
  wrappers:
    mujoco_locomotion_lowdim: {normalization_path: '${normalization_path}'}
    multi_step: {n_obs_steps: '${cond_steps}', n_action_steps: '${act_steps}', max_episode_steps: '${env.max_episode_steps}',
      reset_within_step: true}
wandb: {entity: '${oc.env:DPPO_WANDB_ENTITY}', project: 'gym-${env_name}-finetune', run: '${now:%H-%M-%S}_${name}'}
train:
  n_train_itr: 601
  n_critic_warmup_itr: 0
  n_steps: 70
  gamma: 0.99
  lr: 1e-4
  weight_decay: 0
  lr_scheduler: {first_cycle_steps: 1000, warmup_steps: 10, min_lr: 1e-4}
  save_model_freq: 10
  val_freq: 10
  render: {freq: 1, num: 0}
  max_reward_weight: 100
  beta: 10
  batch_size: 5600
  update_epochs: 16
model:
  _target_: model.diffusion.diffusion_rwr.RWRDiffusion
  min_sampling_denoising_std: 0.1
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    time_dim: 16
    mlp_dims: [256, 256, 256]
    activation_type: ReLU
    residual_style: true
    cond_mlp_dims: [128, 32]
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
ft_denoising_steps: 10
