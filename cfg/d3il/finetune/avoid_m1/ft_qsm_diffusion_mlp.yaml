defaults: [_self_]
hydra:
  run: {dir: '${logdir}'}
_target_: agent.finetune.train_qsm_diffusion_agent.TrainQSMDiffusionAgent
name: ${env_name}_qsm_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/d3il-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/d3il-pretrain/m1/avoid_d56_r12_pre_diffusion_mlp_ta4_td20/2024-07-06_22-50-07/checkpoint/state_10000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/d3il/avoid_m1/normalization.npz
seed: 42
device: cuda:0
env_name: avoiding-m5
obs_dim: 4
action_dim: 2
denoising_steps: 20
cond_steps: 1
horizon_steps: 4
act_steps: 4
env:
  n_envs: 50
  name: ${env_name}
  max_episode_steps: 100
  reset_at_iteration: true
  save_video: false
  best_reward_threshold_for_success: 2
  save_full_observations: true
  wrappers:
    d3il_lowdim: {normalization_path: '${normalization_path}'}
    multi_step: {n_obs_steps: '${cond_steps}', n_action_steps: '${act_steps}', max_episode_steps: '${env.max_episode_steps}',
      pass_full_observations: '${env.save_full_observations}', reset_within_step: false}
wandb: {entity: '${oc.env:DPPO_WANDB_ENTITY}', project: 'd3il-${env_name}-m1-finetune', run: '${now:%H-%M-%S}_${name}'}
train:
  n_train_itr: 51
  n_critic_warmup_itr: 1
  n_steps: ${eval:'round(${env.max_episode_steps} / ${act_steps})'}
  gamma: 0.999
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler: {first_cycle_steps: 1000, warmup_steps: 10, min_lr: 1e-5}
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler: {first_cycle_steps: 1000, warmup_steps: 10, min_lr: 1e-3}
  save_model_freq: 10
  val_freq: 100
  render: {freq: 1, num: 10}
  scale_reward_factor: 1
  q_grad_coeff: 10
  critic_tau: 0.005
  buffer_size: 5000
  replay_ratio: 16
  batch_size: ${eval:'round(${train.n_steps} * ${env.n_envs} * ${ft_denoising_steps} / 2)'}
model:
  _target_: model.diffusion.diffusion_qsm.QSMDiffusion
  min_sampling_denoising_std: 0.1
  randn_clip_value: 3
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObsAct
    action_dim: ${action_dim}
    action_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: true
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
mode: d56_r12
ft_denoising_steps: 10
