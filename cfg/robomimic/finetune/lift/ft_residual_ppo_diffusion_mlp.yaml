# ResiP (Ankile et al., arXiv 2407.16677) on lift.
# Generated by agent/residual/gen_configs.py from cfg/robomimic/finetune/lift/ft_ppo_diffusion_mlp.yaml; do not hand-edit.
defaults: [_self_]
hydra:
  run:
    dir: ${logdir}
_target_: agent.residual.train_residual_ppo_agent.TrainResidualPPOAgent
name: ${env_name}_ft_residual_ppo_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/robomimic-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/robomimic-pretrain/lift/lift_pre_diffusion_mlp_ta4_td20/2024-06-28_14-47-58/checkpoint/state_5000.pt
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}.json
normalization_path: ${oc.env:DPPO_DATA_DIR}/robomimic/${env_name}/normalization.npz
seed: 42
device: cuda:0
env_name: lift
obs_dim: 19
action_dim: 7
denoising_steps: 20
ft_denoising_steps: 0
cond_steps: 1
horizon_steps: 4
act_steps: 4
env:
  n_envs: 50
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 300
  save_video: false
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, object]
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: 1
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true
wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune
  run: ${now:%H-%M-%S}_${name}
train:
  n_train_itr: 200
  n_critic_warmup_itr: 2
  n_steps: 1200
  gamma: 0.999
  actor_lr: 1e-4
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-4
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 10
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: true
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 7500
  update_epochs: 10
  vf_coef: 0.5
  target_kl: 1
  resip:
    learning_rate_actor: 0.0003
    optimizer_betas_actor: [0.9, 0.999]
    learning_rate_critic: 0.005
    lr_scheduler:
      actor_warmup_steps: 5
      critic_warmup_steps: 0
    total_timesteps: 1000000000
    update_epochs: 50
    num_minibatches: 1
    discount: 0.999
    gae_lambda: 0.95
    norm_adv: true
    clip_coef: 0.2
    clip_vloss: false
    ent_coef: 0.0
    vf_coef: 1.0
    max_grad_norm: 1.0
    target_kl: 0.1
    n_iterations_train_only_value: 0
    residual_l1: 0.0
    residual_l2: 0.0
model:
  _target_: agent.residual.residual_diffusion.ResidualDiffusion
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObs
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
  act_steps: ${act_steps}
  obs_clip: 3.0
  action_clip: null
  residual_policy:
    _target_: agent.residual.residual_policy.ResidualPolicy
    actor_mlp_dims: [256, 256]
    critic_mlp_dims: [256, 256]
    actor_activation_type: ReLU
    critic_activation_type: ReLU
    action_scale: 0.1
    init_logstd: -1.0
    learn_std: false
    action_head_std: 0.0
    critic_last_layer_std: 0.25
    critic_last_layer_bias_const: 0.25
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    action_dim: ${action_dim}
