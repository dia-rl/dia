defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
# === DIA: agent (only difference from DPPO base: agent target) ===
_target_: agent.finetune.train_ablation_flatgae_diffusion_agent.TrainAblationFlatGAEDiffusionAgent

name: ${env_name}_ft_diffusion_mlp_flatgae_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/furniture-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/furniture-pretrain/one_leg/one_leg_med_dim_pre_diffusion_mlp_ta8_td100/2024-07-23_01-28-11/checkpoint/state_8000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/furniture/${env.specific.furniture}_${env.specific.randomness}/normalization.pth

seed: 42                              # overridden per-seed at launch (matched to DPPO base)
device: cuda:0
env_name: ${env.specific.furniture}_${env.specific.randomness}_dim
obs_dim: 58
action_dim: 10
denoising_steps: 100
ft_denoising_steps: 5
cond_steps: 1
horizon_steps: 8
act_steps: 8
use_ddim: True

env:
  n_envs: 1000
  name: ${env_name}
  env_type: furniture
  max_episode_steps: 700
  best_reward_threshold_for_success: 1
  specific:
    headless: true
    furniture: one_leg
    randomness: med
    normalization_path: ${normalization_path}
    obs_steps: ${cond_steps}
    act_steps: ${act_steps}
    sparse_reward: False

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: furniture-${env.specific.furniture}-${env.specific.randomness}-finetune
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 1000
  resume_from_itr: 0                  # fresh start (matched to DPPO base, no resume)
  n_critic_warmup_itr: 1
  n_steps: ${eval:'round(${env.max_episode_steps} / ${act_steps})'}
  gamma: 0.999
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-6
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 10
  val_freq: 10
  render:
    freq: 1
    num: 0
  # PPO specific
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 8800
  update_epochs: 5
  vf_coef: 0.5
  target_kl: 1
  # === V_inner additions (NOT present in DPPO base) ===
  # Q ensemble, heads averaged, as on the robomimic tasks.
  logprob_batch_size: 1000           # divides n_envs (1000 % 1000 == 0)
  q_minibatch_size: 2048
  target_ema_rate: 1.0               # no Polyak — let Q track fast
  critic_q_lr: 3e-4
  # V_inner (DIA α=0.5, inner-MDP r_in=0 / gamma_in=1 / lambda_in=0.95)
  use_v_inner: True
  v_inner_alpha: 0.5
  v_inner_lambda: 0.95
  v_inner_update_epochs: 5            # match furniture V_phi update_epochs (=update_epochs)
  v_inner_lr: 1e-3
  # ---- flat-GAE latent MDP knobs ----
  flat_bar_gamma: 1.0
  flat_bar_lambda: 0.995       # = 0.95^(1/K); effective outer lambda 0.95

model:
  # === DIA: model (only difference from DPPO base: model target + Q/V_inner heads) ===
  _target_: model.diffusion.diffusion_ppo_dia.PPODIADiffusion
  # HP to tune
  gamma_denoising: 0.9
  clip_ploss_coef: 0.001
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.04
  #
  use_ddim: ${use_ddim}
  ddim_steps: ${ft_denoising_steps}
  learn_eta: False
  eta:
    base_eta: 1
    input_dim: ${obs_dim}
    mlp_dims: [256, 256]
    action_dim: ${action_dim}
    min_eta: 0.1
    max_eta: 1.0
    _target_: model.diffusion.eta.EtaFixed
  # V_inner potential / Q-aggregation
  q_aggregation: mean
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims: [1024, 1024, 1024, 1024, 1024, 1024, 1024]
    cond_mlp_dims: [512, 64]
    use_layernorm: True # needed for larger MLP
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [512, 512, 512]
    activation_type: Mish
    residual_style: True
  critic_q:
    _target_: model.common.critic.CriticObsAct
    action_dim: ${action_dim}
    action_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [2048, 2048, 2048]
    activation_type: Tanh
    use_layernorm: True
    residual_style: False
    n_heads: 10                       # 10-head Q ensemble
    dropout: 0.0
  critic_v_inner:
    _target_: model.common.critic.CriticObsInnerState
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    mlp_dims: [1024, 1024, 1024]
    time_dim: 32
    activation_type: Mish
    use_layernorm: True
    residual_style: True
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
