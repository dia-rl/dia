defaults: [_self_]
hydra:
  run: {dir: '${logdir}'}
_target_: agent.finetune.train_idql_diffusion_agent.TrainIDQLDiffusionAgent
name: ${env_name}_idql_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/gym-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: pretrained/${env_name}/normfix_bc_state_3000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/gym/${env_name}/normalization.npz
seed: 42
device: cuda:0
env_name: kitchen-mixed-v0
obs_dim: 60
action_dim: 9
denoising_steps: 20
cond_steps: 1
horizon_steps: 4
act_steps: 4
env:
  n_envs: 40
  name: ${env_name}
  max_episode_steps: 280
  reset_at_iteration: false
  save_video: false
  best_reward_threshold_for_success: 4
  wrappers:
    mujoco_locomotion_lowdim: {normalization_path: '${normalization_path}'}
    multi_step: {n_obs_steps: '${cond_steps}', n_action_steps: '${act_steps}', max_episode_steps: '${env.max_episode_steps}',
      reset_within_step: true}
wandb: {entity: '${oc.env:DPPO_WANDB_ENTITY}', project: 'gym-${env_name}-finetune', run: '${now:%H-%M-%S}_${name}'}
train:
  n_train_itr: 601
  n_critic_warmup_itr: 0
  n_steps: 70
  gamma: 0.99
  actor_lr: 1e-4
  actor_weight_decay: 0
  actor_lr_scheduler: {first_cycle_steps: 1000, warmup_steps: 10, min_lr: 1e-4}
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler: {first_cycle_steps: 1000, warmup_steps: 10, min_lr: 1e-3}
  save_model_freq: 10
  val_freq: 10
  render: {freq: 1, num: 0}
  scale_reward_factor: 0.01
  eval_deterministic: true
  eval_sample_num: 20
  critic_tau: 0.001
  use_expectile_exploration: true
  buffer_size: 25000
  replay_ratio: 128
  batch_size: 5600
model:
  _target_: model.diffusion.diffusion_idql.IDQLDiffusion
  min_sampling_denoising_std: 0.1
  randn_clip_value: 3
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    time_dim: 16
    mlp_dims: [256, 256, 256]
    activation_type: ReLU
    residual_style: true
    cond_mlp_dims: [128, 32]
  critic_q:
    _target_: model.common.critic.CriticObsAct
    action_dim: ${action_dim}
    action_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: true
  critic_v:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: true
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
ft_denoising_steps: 10
