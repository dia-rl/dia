defaults: [_self_]
hydra:
  run: {dir: '${logdir}'}
_target_: agent.finetune.train_rwr_diffusion_agent.TrainRWRDiffusionAgent
name: ${env_name}_rwr_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/d3il-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/d3il-pretrain/m3/avoid_d58_r12_pre_diffusion_mlp_ta4_td20/2024-07-07_13-54-54/checkpoint/state_15000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/d3il/avoid_m3/normalization.npz
seed: 42
device: cuda:0
env_name: avoiding-m5
obs_dim: 4
action_dim: 2
denoising_steps: 20
cond_steps: 1
horizon_steps: 4
act_steps: 4
env:
  n_envs: 50
  name: ${env_name}
  max_episode_steps: 100
  reset_at_iteration: true
  save_video: false
  best_reward_threshold_for_success: 2
  save_full_observations: true
  wrappers:
    d3il_lowdim: {normalization_path: '${normalization_path}'}
    multi_step: {n_obs_steps: '${cond_steps}', n_action_steps: '${act_steps}', max_episode_steps: '${env.max_episode_steps}',
      pass_full_observations: '${env.save_full_observations}', reset_within_step: false}
wandb: {entity: '${oc.env:DPPO_WANDB_ENTITY}', project: 'd3il-${env_name}-m3-finetune', run: '${now:%H-%M-%S}_${name}'}
train:
  n_train_itr: 51
  n_critic_warmup_itr: 1
  n_steps: ${eval:'round(${env.max_episode_steps} / ${act_steps})'}
  gamma: 0.999
  lr: 1e-5
  weight_decay: 1e-6
  lr_scheduler: {first_cycle_steps: 1000, warmup_steps: 10, min_lr: 1e-5}
  save_model_freq: 10
  val_freq: 100
  render: {freq: 1, num: 10}
  max_reward_weight: 100
  beta: 10
  batch_size: ${eval:'round(${train.n_steps} * ${env.n_envs} * ${ft_denoising_steps} / 2)'}
  update_epochs: 16
model:
  _target_: model.diffusion.diffusion_rwr.RWRDiffusion
  min_sampling_denoising_std: 0.1
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
mode: d58_r12
ft_denoising_steps: 10
