# ResiP (Ankile et al., arXiv 2407.16677) on one_leg_med.
# Generated by agent/residual/gen_configs.py from cfg/furniture/finetune/one_leg_med/ft_ppo_diffusion_mlp.yaml; do not hand-edit.
defaults: [_self_]
hydra:
  run:
    dir: ${logdir}
_target_: agent.residual.train_residual_ppo_agent.TrainResidualPPOAgent
name: ${env_name}_ft_residual_ppo_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/furniture-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/furniture-pretrain/one_leg/one_leg_med_dim_pre_diffusion_mlp_ta8_td100/2024-07-23_01-28-11/checkpoint/state_8000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/furniture/${env.specific.furniture}_${env.specific.randomness}/normalization.pth
seed: 42
device: cuda:0
env_name: ${env.specific.furniture}_${env.specific.randomness}_dim
obs_dim: 58
action_dim: 10
denoising_steps: 100
ft_denoising_steps: 0
cond_steps: 1
horizon_steps: 8
act_steps: 8
use_ddim: true
env:
  n_envs: 1000
  name: ${env_name}
  env_type: furniture
  max_episode_steps: 700
  best_reward_threshold_for_success: 1
  specific:
    headless: true
    furniture: one_leg
    randomness: med
    normalization_path: ${normalization_path}
    obs_steps: ${cond_steps}
    act_steps: 1
    sparse_reward: false
wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: furniture-${env.specific.furniture}-${env.specific.randomness}-finetune
  run: ${now:%H-%M-%S}_${name}
train:
  n_train_itr: 1000
  n_critic_warmup_itr: 1
  n_steps: 704
  gamma: 0.999
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-6
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 10000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 10
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: true
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 8800
  update_epochs: 5
  vf_coef: 0.5
  target_kl: 1
  resip:
    learning_rate_actor: 0.0003
    optimizer_betas_actor: [0.9, 0.999]
    learning_rate_critic: 0.005
    lr_scheduler:
      actor_warmup_steps: 5
      critic_warmup_steps: 0
    total_timesteps: 1000000000
    update_epochs: 50
    num_minibatches: 1
    discount: 0.999
    gae_lambda: 0.95
    norm_adv: true
    clip_coef: 0.2
    clip_vloss: false
    ent_coef: 0.0
    vf_coef: 1.0
    max_grad_norm: 1.0
    target_kl: 0.1
    n_iterations_train_only_value: 0
    residual_l1: 0.0
    residual_l2: 0.0
model:
  _target_: agent.residual.residual_diffusion.ResidualDiffusion
  gamma_denoising: 0.9
  clip_ploss_coef: 0.001
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.04
  use_ddim: ${use_ddim}
  ddim_steps: 5
  learn_eta: false
  eta:
    base_eta: 1
    input_dim: ${obs_dim}
    mlp_dims: [256, 256]
    action_dim: ${action_dim}
    min_eta: 0.1
    max_eta: 1.0
    _target_: model.diffusion.eta.EtaFixed
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims: [1024, 1024, 1024, 1024, 1024, 1024, 1024]
    cond_mlp_dims: [512, 64]
    use_layernorm: true
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [512, 512, 512]
    activation_type: Mish
    residual_style: true
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
  act_steps: ${act_steps}
  obs_clip: 3.0
  action_clip: null
  residual_policy:
    _target_: agent.residual.residual_policy.ResidualPolicy
    actor_mlp_dims: [256, 256]
    critic_mlp_dims: [256, 256]
    actor_activation_type: ReLU
    critic_activation_type: ReLU
    action_scale: 0.1
    init_logstd: -1.0
    learn_std: false
    action_head_std: 0.0
    critic_last_layer_std: 0.25
    critic_last_layer_bias_const: 0.25
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    action_dim: ${action_dim}
